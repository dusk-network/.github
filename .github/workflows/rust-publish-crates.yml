on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label or image"
        required: false
        type: string
        default: ubuntu-latest
      manifest-path:
        description: "Path to the workspace or package Cargo.toml"
        required: false
        type: string
        default: Cargo.toml
      config:
        description: "Path to release-plz.toml"
        required: false
        type: string
        default: release-plz.toml
      publish-packages:
        description: "Comma-separated list of crates expected to be publishable"
        required: true
        type: string
      environment:
        description: "GitHub Environment used for crates.io publishing"
        required: false
        type: string
        default: crates-io
      release-plz-version:
        description: "release-plz binary version"
        required: false
        type: string
        default: "0.3.157"

name: Rust Publish Crates

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  publish:
    name: Publish crates
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    if: ${{ github.repository_owner == 'dusk-network' }}
    concurrency:
      group: rust-publish-crates-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Dusk reusable workflow scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: dusk-network/.github
          ref: ${{ github.workflow_sha }}
          path: .dusk-workflows
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - name: Validate release metadata and publish surface
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          PUBLISH_PACKAGES: ${{ inputs.publish-packages }}
        run: >
          python3 .dusk-workflows/.github/scripts/validate-rust-publish-surface.py
          --manifest-path "$MANIFEST_PATH"
          --publish-packages "$PUBLISH_PACKAGES"

      - name: Publish unpublished crates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          CONFIG: ${{ inputs.config }}
          RELEASE_PLZ_VERSION: ${{ inputs.release-plz-version }}
        run: |
          set -euo pipefail
          cargo install --locked release-plz --version "$RELEASE_PLZ_VERSION"
          release-plz release \
            --git-token "$GITHUB_TOKEN" \
            --manifest-path "$MANIFEST_PATH" \
            --config "$CONFIG"
